server:
  port: 8080

spring:
  application:
    name: BE_Young04

  main:
    web-application-type: servlet

  config:
    import: file:./application-secret.properties

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect