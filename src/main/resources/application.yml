server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: BE_Young04

  main:
    web-application-type: servlet

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  config:
    import: file:./application-secret.properties

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      schema-locations: classpath:schema.sql
      data-locations: classpath:wcag.sql

  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      "[hibernate.format_sql]": true
    database-platform: org.hibernate.dialect.MySQLDialect

app:
  git:
    workspace-root: ${GIT_WORKSPACE_ROOT:./git-workspaces}
    command-timeout-seconds: ${GIT_COMMAND_TIMEOUT_SECONDS:30}
    default-remote: ${GIT_DEFAULT_REMOTE:origin}
